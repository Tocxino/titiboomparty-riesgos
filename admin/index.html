<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control de riesgos Titi Boom Party</title>
<style>
:root{--ink:#1d1a2e;--muted:#6a6479;--bg:#faf8fb;--card:#fff;--line:#e7e2ec;--accent:#c2306f;--bad:#c0262d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#f1edf6;--muted:#a9a2b8;--bg:#16131d;--card:#211d2b;--line:#363044;--accent:#f06aa3;--bad:#ff7a7f;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;display:grid;gap:14px}
h1{margin:0;font-size:24px;line-height:1.15}h1 span{color:var(--accent)}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:600;display:grid;gap:4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px system-ui,sans-serif;border:0;border-radius:9px;padding:10px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:20px;color:var(--bad);font-size:13px;font-weight:600}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Titi Boom Party · <span>control de riesgos</span></h1>
  <p>Acceso solo para el equipo. Escribe el usuario y la contraseña.</p>
  <label for="u">Usuario<input id="u" name="username" autocomplete="username" required></label>
  <label for="p">Contraseña<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button id="b" type="submit">Entrar</button>
  <div id="msg" role="alert"></div>
</form>

function tob64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function descifrar(raw){
  return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]).then(function(k){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.ct));
  }).then(function(pt){
    return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  });
}

function pbk(u,p,salt,it){

  return crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+":"+p),"PBKDF2",false,["deriveBits"]).then(function(k){
    return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:typeof salt==="string"?enc.encode(salt):salt,iterations:it},k,256);
  });
}
